name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    # TODO: Remove continue-on-error after #8 (lint config adoption) lands
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-lint-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-lint-
            ${{ runner.os }}-bun-
      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install
      - name: Lint
        run: bun run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            src/editor/base/parser/node_modules
          key: ${{ runner.os }}-bun-full-${{ hashFiles('bun.lock', 'src/editor/base/parser/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-full-
            ${{ runner.os }}-bun-
      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install
      - name: Build parser
        run: |
          cd src/editor/base/parser
          bun install --frozen-lockfile || bun install
          bun run build
      - name: Typecheck
        run: bun run tsc -noEmit -skipLibCheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            src/editor/base/parser/node_modules
          key: ${{ runner.os }}-bun-full-${{ hashFiles('bun.lock', 'src/editor/base/parser/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-full-
            ${{ runner.os }}-bun-
      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install
      - name: Build parser
        run: |
          cd src/editor/base/parser
          bun install --frozen-lockfile || bun install
          bun run build
      - name: Test
        run: bun run test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            src/editor/base/parser/node_modules
          key: ${{ runner.os }}-bun-full-${{ hashFiles('bun.lock', 'src/editor/base/parser/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-full-
            ${{ runner.os }}-bun-
      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install
      - name: Build parser
        run: |
          cd src/editor/base/parser
          bun install --frozen-lockfile || bun install
          bun run build
      - name: Build plugin
        run: bun run build
